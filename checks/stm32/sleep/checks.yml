checks:
  - name: sleep_result
  - name: sleep_elapsed
  - name: sleep_seconds
    for: 2
  - name: sleep_drift
  - name: asleep_cadence
  - name: asleep_overrun
  - name: blink_duty
    duty: 2 0.5 0.05
  - name: heartbeat_duty
    duty: 3 0.1 0.05
  - name: sleep_interrupt_delivery
    feed: feed/one_byte.resc
  - name: asleep_us_stale_mark
    feed: feed/one_byte.resc
