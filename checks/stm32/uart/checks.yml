checks:
  - name: rx_order
    input: input/rx_order.bin
  - name: peek
    input: input/peek.bin
  - name: gets_terminator
    input: input/gets_terminator.bin
  - name: rx_overflow
    input: input/rx_overflow.bin
  - name: rx_interrupt
    input: input/rx_interrupt.bin
  - name: tx_bytes
  - name: frame
    observe: observe/frame.resc
  - name: rx_default_254
    input_bytes: 254
  - name: rx_default_255
    input_bytes: 255
  - name: rx_default_256
    input_bytes: 256
  - name: rx_default_512
    input_bytes: 512
  - name: rx_resume_after_full
    feed: feed/rx_resume_after_full.resc
  - name: rx_wraparound
    input_bytes: 300
    chunk_size: 100
