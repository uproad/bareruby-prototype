# Which samples a simulated run verifies. ./checks/simulate.sh reads this file: every
# sample below is built for the host entry, run under the simulator with
# `bareruby emulate --target=<host>`, and what it printed compared line for line against
# the same program run natively on this desk. The native run is the oracle, so no
# expected output is stored here to go stale.
#
#   sample:  the program, from the repository root.
#   for:     virtual seconds handed to --for=. 3 when unsaid.
#   input:   what to put on the wire — stdin, which is the serial port's receive line
#            and what an I2C read answers with. \n is a newline.
#
# **Every sample is here**, which is the difference between this list and the emulated
# one beside it. A simulated run needs no board modelled, no device on a bus and no
# harness to feed a UART: the peripherals are objects, and what they answer is what this
# side put in them. The programs that loop forever are here too — they end when the
# virtual time runs out, because an instruction costs virtual time.
#
# What this cannot check is the half that is not printed. A program that only writes pins
# says nothing either way, so `blink` passing means the two runs agree about nothing
# rather than about the LED. Reading a board back is what the simulator is for, and a
# check that does it is a harness step of its own.

checks:
  - sample: samples/adc.rb
  - sample: samples/arena.rb
  - sample: samples/array.rb
  - sample: samples/asleep.rb
  - sample: samples/avs.rb
  - sample: samples/blink.rb
  - sample: samples/block_parameters.rb
  - sample: samples/definite_assignment.rb
  - sample: samples/features.rb
  - sample: samples/fixed.rb
  - sample: samples/gpio_pico_loop.rb
  - sample: samples/heartbeat.rb
  - sample: samples/i2c.rb
    input: "OK"
  - sample: samples/implicit_return.rb
  - sample: samples/interrupt.rb
  - sample: samples/logger.rb
    input: "ABCD"
  - sample: samples/m25.rb
  - sample: samples/nilable.rb
  - sample: samples/object.rb
  - sample: samples/peripheral_answers.rb
  - sample: samples/peripheral_ruby.rb
  - sample: samples/picoruby_interface.rb
    input: "OK"
  - sample: samples/require.rb
  - sample: samples/require_helper.rb
  - sample: samples/require_lib.rb
  - sample: samples/servo.rb
  - sample: samples/sleep_interrupt.rb
  - sample: samples/string.rb
  - sample: samples/tenji.rb
  - sample: samples/tenji_int.rb
  - sample: samples/uart_buffered.rb
    input: "ABCDhello UART\n"
  - sample: samples/uart_flow_control.rb
  - sample: samples/uart_format.rb
  - sample: samples/uart_line_ending.rb
    input: "ABCDhello UART\n"
  - sample: samples/uart_one_queue.rb
    input: "ABCDhello UART\n"
  - sample: samples/uart_receive.rb
    input: "ABCDhello UART\n"
  - sample: samples/uart_rx_buffer.rb
    input: "ABCDhello UART\n"
  - sample: samples/uart_rx_receive.rb
    input: "ABCDhello UART\n"
  - sample: ref.rb
