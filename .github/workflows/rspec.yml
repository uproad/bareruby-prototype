name: rspec checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rspec-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: rspec ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite:
          - bareruby_prot
          - bareruby_prot-compiler
          - bareruby_prot-stdlib-adc
          - bareruby_prot-stdlib-gpio
          - bareruby_prot-stdlib-i2c
          - bareruby_prot-stdlib-onboard_led
          - bareruby_prot-stdlib-pwm
          - bareruby_prot-stdlib-uart
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Package the working-tree compiler
        if: matrix.suite != 'bareruby_prot-compiler'
        working-directory: gems/bareruby_prot-compiler
        run: |
          mkdir -p "${{ github.workspace }}/gems/${{ matrix.suite }}/vendor/cache"
          gem build bareruby_prot-compiler.gemspec \
            --output "${{ github.workspace }}/gems/${{ matrix.suite }}/vendor/cache/bareruby_prot-compiler-0.0.1.gem"

      - name: Install the locked bundle
        working-directory: gems/${{ matrix.suite }}
        run: bundle install

      - name: Run the suite
        working-directory: gems/${{ matrix.suite }}
        run: bundle exec rspec
