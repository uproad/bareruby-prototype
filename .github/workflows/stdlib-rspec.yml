name: stdlib rspec checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stdlib-rspec-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: rspec ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite:
          - bareruby_prot-stdlib-adc
          - bareruby_prot-stdlib-gpio
          - bareruby_prot-stdlib-i2c
          - bareruby_prot-stdlib-onboard_led
          - bareruby_prot-stdlib-pwm
          - bareruby_prot-stdlib-uart
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Install the working-tree compiler
        working-directory: gems/bareruby_prot-compiler
        run: |
          gem build bareruby_prot-compiler.gemspec \
            --output "${{ runner.temp }}/bareruby_prot-compiler-0.0.1.gem"
          gem install --local \
            "${{ runner.temp }}/bareruby_prot-compiler-0.0.1.gem" \
            --no-document

      - name: Install the bundle
        working-directory: gems/${{ matrix.suite }}
        run: bundle install

      - name: Run the suite
        working-directory: gems/${{ matrix.suite }}
        run: bundle exec rspec
