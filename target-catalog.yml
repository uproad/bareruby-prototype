# What `bareruby target add` asks, and in what order.
#
# A composition is three answers — which board, what it is called through, which
# instruction set — and none of them is a thing a Ruby programmer new to microcontrollers
# should have to go and look up. So they are not asked for. What is asked is the board, in
# the words its own maker uses, and the three answers follow from that.
#
# Nothing here restates a composition. A family names targets, and the machine, binding and
# triple of each come from target/target.rb, where they already are. Adding a board here
# once it exists there is adding a label and a question, not a second source of truth.
#
# A label is the family's own name and nothing more. What it is reached through is one of
# the three the composition already spells out, and repeating it in the question only makes
# the reader carry it twice.
#
# `asks` is what a family needs beyond the machine, the name and the debug build, which
# every entry has and which `target add` asks for itself. Each one takes:
#
# Which boards are attached is not among them. It is not knowable when an entry is made —
# a serial is read off the machine in front of you, and an RP2040 answers with a different
# one in BOOTSEL than while running — and it is not needed until two boards of one chip
# are attached at once, which flashing detects and prints the candidates for. `boards:` is
# written empty and filled in when that day comes.
#
#   key           where the answer goes in the entry. `options.` prefixes go under it.
#   label         the question.
#   kind          text | path | list | choice
#   choices       for kind: choice.
#   optional      true to let an empty answer skip the key entirely.
#   hint          printed before the question.
#   hint_command  run before the question, and its output printed.

# The order is the order they are offered in, and it is fixed. **The one that needs no
# hardware comes first**, because it is the only family that is always there — everything
# else is a machine somebody went out and bought, and in time each will arrive on its own
# rather than from here. The rest are alphabetical, so a name is found by looking where it
# would be, and so anything attaching from outside has one obvious place to go: below.

bareruby:
  families:
    - key: host
      label: none
      targets:
        - host
      asks: []

    - key: arduino
      label: Arduino
      targets:
        - arduino-mega2560
      asks: []

    - key: pico
      label: Raspberry Pi Pico
      targets:
        - raspberry-pi-pico
        - raspberry-pi-pico-w
        - raspberry-pi-pico2
        - raspberry-pi-pico2-w
      asks: []

    - key: stm32
      label: ST NUCLEO
      targets:
        - stm32-nucleo-f446re
      asks:
        - key: options.cube_project
          label: Path to the CubeMX project this is built in
          kind: path
          optional: true
          hint: Leave empty unless this desk keeps more than one, or keeps its own elsewhere.
        - key: options.configuration
          label: How to optimize this build
          kind: choice
          choices:
            - Debug
            - Release
          optional: true

  # Reserved. A family appears here when its targets exist in target/target.rb.
  #
  #   - key: esp32
  #     label: Espressif development boards, through ESP-IDF
