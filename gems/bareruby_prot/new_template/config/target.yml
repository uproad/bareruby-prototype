# Which compositions this project is built for, and what is attached to take them.
#
# This file is not meant to be written by hand: `bareruby target add` asks which board it
# is — first roughly, by the family its maker sells it in, then exactly — and writes the
# answer here. Nothing in an entry has to be looked up, which is the point: a triple is
# not something a Ruby programmer new to microcontrollers should have to go and find out.
#
# The entry below was written by `bareruby new`, and is the machine doing the compiling.
# It is here so that this project builds and runs before a board is attached to it. It is
# the one entry whose composition is not the same on two desks — the triple is whatever
# this machine happens to be — so it is named, and `build/host/` is a path that can be
# typed, and written down for someone else, on any of them.
#
# `bareruby build`, `flash` and `deploy` take their targets from here when no --target is
# given. `bareruby compile` never reads this file: a compilation is exactly what its
# command line asked for.
#
# An entry names a composition rather than a target, and always names all three parts of
# it, because no one of them settles another. One board is reachable through more than one
# binding, and one whose chip carries two instruction sets is built for either of them.
#
#   machine:  which board.
#   binding:  what it is called through.
#   triple:   which instruction set, and what lies under it.
#   name:     optional. The directory under build/ this entry lands in. Without it the
#             directory is <machine>-<binding>-<triple>, which is long because that is how
#             much it takes to be unique. Give a name to be shorter than that, or when one
#             composition is wanted twice — a debug build and a release build of the same
#             board.
#   debug:    optional. `true` or `1` and nothing else means a debug build.
#   boards:   optional, and usually best left out. With nothing here the one attached
#             board the artifact fits is found and written to, because the image says
#             which chip it is for. Name serials only when two boards carry the same chip.
#   options:  optional. What only this desk knows, passed to the binding that needs it.
#
# The first three lines of an entry are true of this project; `boards` and `options` are
# true of one desk. They live together until a second desk needs them not to.
targets:
  - name: host
    machine: none
    binding: host
    triple: __TRIPLE__
