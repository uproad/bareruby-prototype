# ST NUCLEO-F446RE. What the board adds to the silicon: which pins are wired to what,
# and the clock profile this repository has run on the physical board.
key: nucleo_f446re
name: stm32-nucleo-f446re
family: stm32f4
device: stm32f446retx
# 84 MHz from HSI — the configuration every earlier BareRuby firmware on this board was
# verified under, kept rather than raised: a clock profile is proven on hardware or it
# is a claim.
clock:
  source: hsi
  # The F446 carries the R divider, so its struct asks for a value even while nothing
  # runs from it.
  pll: { m: 16, n: 336, p: 4, q: 2, r: 2 }
  ahb_divider: 1
  apb1_divider: 2
  apb2_divider: 1
  regulator_scale: 3
led:
  # LD2, the user LED.
  pin: PA5
  active_high: true
uart:
  # UART 0 is the ST-LINK virtual COM port, which is what makes it stdout.
  - id: 0
    instance: USART2
    tx: { pin: PA2, af: 7 }
    rx: { pin: PA3, af: 7 }
    stdout: true
i2c:
  # Arduino D15/D14. External pull-ups, as the samples document.
  - id: 1
    instance: I2C1
    scl: { pin: PB8, af: 4 }
    sda: { pin: PB9, af: 4 }
pwm:
  # Which timer answers a pin is silicon fact, recorded here so a program only ever
  # says the pin. PA15 is what the Pico-numbered samples (pin 15) land on; PA5 shares
  # the LD2 wire, which is what makes its duty observable in the emulator; PC7 is
  # Arduino D9, the classic servo header.
  - { pin: PA5, instance: TIM2, channel: 1, af: 1 }
  - { pin: PA15, instance: TIM2, channel: 1, af: 1 }
  - { pin: PC7, instance: TIM3, channel: 2, af: 2 }
adc:
  # Which ADC1 channel reads a pin is silicon fact, recorded like PWM's table so a
  # program only ever says the pin. These six are the Arduino header's A0–A5; PA2,
  # PA3 (stdout's USART2) and PA5 (LD2) carry channels too, but wiring them here
  # would let a program silently unhook what stdout and the LED stand on.
  - { pin: PA0, channel: 0 }
  - { pin: PA1, channel: 1 }
  - { pin: PA4, channel: 4 }
  - { pin: PB0, channel: 8 }
  - { pin: PC1, channel: 11 }
  - { pin: PC0, channel: 10 }
probe:
  openocd:
    interface: stlink
    target: stm32f4x
