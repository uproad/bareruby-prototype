families:
  stm32f4:
    # One release and its submodule commits move as a set. Updating one of them to
    # anything the release did not pin is how CMSIS and the HAL drift apart.
    cube:
      github: STMicroelectronics/STM32CubeF4
      tag: v1.28.3
      commit: 94cae6e83f00e276a11957e7833c01ac3d0bd7af
      directory: stm32cube/STM32CubeF4-1.28.3
      submodules:
        Drivers/CMSIS/Device/ST/STM32F4xx: 3c77349ce04c8af401454cc51f85ea9a50e34fc1
        Drivers/STM32F4xx_HAL_Driver: b6f0ed3829f3829eb358a2e7417d80bba1a42db7
    # Read by the update tooling when manifests are regenerated, never by a build.
    open_pin_data:
      github: STMicroelectronics/STM32_open_pin_data
      commit: 7d1f1514ed5583ec5007ad91236b4e1d377295b1
      directory: stm32cube/STM32_open_pin_data-7d1f1514
